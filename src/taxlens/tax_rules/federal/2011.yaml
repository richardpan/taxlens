  mfj:    [[0, 0.00], [69000, 0.15]]
  mfs:    [[0, 0.00], [34500, 0.15]]
  hoh:    [[0, 0.00], [46250, 0.15]]

se_tax:
  net_earnings_multiplier: 0.9235
  # Special: TRA-2010 cut the employee SS rate to 4.2% for 2011 (the
  # employer's 6.2% was unchanged, so SE rate is 10.4%, not 12.4%).
  social_security_rate: 0.104
  social_security_wage_base: 106800
  medicare_rate: 0.029
  deductible_fraction: 0.5

