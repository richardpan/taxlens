# Federal tax rules for TY 2011 — PRE-TCJA, PRE-ATRA.
# Top bracket capped at 35%. NO NIIT, NO Additional Medicare Tax,
# NO PEP, NO Pease. AMT exemption reflects the 2010 "patch" extended
# through 2011 by the Tax Relief, Unemployment Insurance
# Reauthorization, and Job Creation Act of 2010.
# Sources: IRS Rev. Proc. 2010-40.

year: 2011
nol_full_offset: true

standard_deduction:
  single: 5800
  mfj: 11600
  mfs: 5800
  hoh: 8500
  qss: 11600

ordinary_brackets:
  single:
    - [0,        0.10]
    - [8500,     0.15]
    - [34500,    0.25]
    - [83600,    0.28]
    - [174400,   0.33]
    - [379150,   0.35]
  mfj:
    - [0,        0.10]
    - [17000,    0.15]
    - [69000,    0.25]
    - [139350,   0.28]
    - [212300,   0.33]
    - [379150,   0.35]
  mfs:
    - [0,        0.10]
    - [8500,     0.15]
    - [34500,    0.25]
    - [69675,    0.28]
    - [106150,   0.33]
    - [189575,   0.35]
  hoh:
