# Minnesota individual income tax — TY 2023.
# Source: M1 instructions for 2023, Minn. Stat. §290.06.
# Graduated brackets to 9.85%. LTCG taxed as ordinary income.
# Standard deduction follows federal: single $13,825 / MFJ $27,650 / HOH $18,650
# for 2023.
# Note: MN's net-investment-income surtax over $1M starts in TY 2024 (SF 3269),
# so it is not modeled here.

