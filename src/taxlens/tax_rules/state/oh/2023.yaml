# Ohio individual income tax — TY 2023.
# Source: Ohio IT 1040 instructions for 2023, ORC §5747.02.
# 2023 schedule (pre-HB 33 collapse): 0% under $26,050; 2.75% [$26,050-$100k];
# 3.688% [$100k-$115,300]; 3.75% over $115,300.
# (HB 33 simplified to 2 brackets effective TY 2024.)
# Personal exemption ($2,400 if AGI <= $40k, scaled) approximated as fixed
# $2,400 standard deduction for simplicity, matching the 2024 file.

state: OH
year: 2023

standard_deduction:
  single: 2400
  mfj:    4800
  mfs:    2400
  hoh:    2400
  qss:    4800

