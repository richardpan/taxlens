name: release

# Cross-platform installer build. Triggers on any v*.*.* tag push, or
# manually via the GitHub UI. Produces:
#   - Windows:  TaxLens-Setup-x.y.z.exe       (NSIS installer)
#   - macOS:    TaxLens-x.y.z.dmg + .zip      (universal2 if runner allows)
#   - Linux:    TaxLens-x.y.z.AppImage
# and uploads them as assets on the matching GitHub Release.
#
# Installers are NOT code-signed in this workflow — see docs/signing.md for
# the EV / notarytool flow that swaps in secrets-based signing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.4.0). Must already exist."
        required: true

permissions:
  contents: write    # upload release assets
  id-token: write    # required for build-provenance attestation
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: "desktop/dist/*.exe"
          - os: macos-latest
            artifact_glob: "desktop/dist/*.dmg"
          - os: ubuntu-latest
            artifact_glob: "desktop/dist/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps + project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: Sync desktop/package.json version from tag
        # electron-builder names artifacts using desktop/package.json's
        # `version` field, and tests/test_release_version_sync.py asserts
        # pyproject.toml + desktop/package.json stay in lockstep.
        # Without rewriting BOTH files, either the artifact filenames
        # ship stale OR the version-sync test fails. We rewrite both on
        # the runner (no commit) so the artifacts produced below carry
        # the correct version even when re-running the workflow against
        # an older tag whose checked-in versions were stale.
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          python - <<PY
          import json, pathlib, re
          # desktop/package.json — JSON, simple replacement
          p = pathlib.Path("desktop/package.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["version"] = "${version}"
          p.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(f"desktop/package.json version -> ${version}")
          # pyproject.toml — rewrite first top-level version line so
          # the version-sync test keeps passing under release builds
          # for older tags whose checked-in pyproject is stale.
          py = pathlib.Path("pyproject.toml")
          text = py.read_text(encoding="utf-8")
          new_text, n = re.subn(
              r'^version\s*=\s*"[^"]+"',
              f'version = "${version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          assert n == 1, "did not find a version line in pyproject.toml"
          py.write_text(new_text, encoding="utf-8")
          print(f"pyproject.toml version -> ${version}")
          PY

      - name: Run tests
        run: pytest -q

      - name: Build backend executable (PyInstaller)
        run: python desktop/scripts/build_backend.py

      - name: Install electron-builder deps
        working-directory: desktop
        run: npm install

      - name: Build installer
        working-directory: desktop
        env:
          # electron-builder reads GH_TOKEN to optionally publish; we upload
          # manually below so it stays unset to avoid double-publish.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish=never

      - name: Ad-hoc codesign (macOS)
        # Free ad-hoc signature silences the "TaxLens is damaged" error on
        # Apple Silicon. Gatekeeper still requires right-click -> Open the
        # first time (no $99 Developer ID = no notarization).
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          for app in desktop/dist/mac*/TaxLens.app desktop/dist/mac/TaxLens.app; do
            [ -d "$app" ] || continue
            echo "Ad-hoc signing $app"
            codesign --force --deep --sign - "$app" || true
          done

      - name: Compute SHA-256 checksums
        shell: bash
        run: |
          shopt -s nullglob
          for f in ${{ matrix.artifact_glob }}; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
            cat "$f.sha256"
          done

      - name: Attest build provenance
        # Free cryptographic proof this binary was built from this commit by
        # GitHub's runners. Verify with: gh attestation verify <file> --repo richardpan/taxlens
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.artifact_glob }}

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # Pick release notes in this priority order:
          #   1. Matching CHANGELOG.md section for the tag (rich, hand-written).
          #   2. The annotated/lightweight tag's message, if non-empty.
          #   3. The tagged commit's message body — for our workflow this is
          #      the detailed "vX.Y.Z: ..." commit we always write.
          # Only if all three are empty do we leave notes.md unset and let
          # `gh release create --generate-notes` autogenerate from the commit
          # log between the previous release and this tag.
          python - <<PY
          import re, subprocess, pathlib
          tag_v = "${tag}"
          tag_bare = tag_v.lstrip("v")
          notes = ""
          changelog = pathlib.Path("CHANGELOG.md")
          if changelog.is_file():
              text = changelog.read_text(encoding="utf-8")
              pat = re.compile(
                  rf"^##\s*\[{re.escape(tag_bare)}\][^\n]*\n(.*?)(?=^##\s*\[|\Z)",
                  re.DOTALL | re.MULTILINE,
              )
              m = pat.search(text)
              if m:
                  notes = m.group(1).strip()
          if not notes:
              # Tag message (annotated-tag case). %(contents) is empty for
              # lightweight tags, so this naturally falls through.
              try:
                  tag_msg = subprocess.check_output(
                      ["git", "for-each-ref", f"refs/tags/{tag_v}",
                       "--format=%(contents)"],
                      text=True,
                  ).strip()
                  # Strip the trailing PGP signature block if present.
                  tag_msg = re.split(r"-----BEGIN PGP", tag_msg)[0].strip()
                  if tag_msg:
                      notes = tag_msg
              except subprocess.CalledProcessError:
                  pass
          if not notes:
              # Commit body of the tagged commit. Our version-bump commits
              # always carry full release notes here.
              try:
                  commit_msg = subprocess.check_output(
                      ["git", "log", "-1", "--format=%B", tag_v],
                      text=True,
                  ).strip()
                  # Drop the trailing Co-authored-by trailer for cleanliness.
                  commit_msg = re.sub(
                      r"\n+Co-authored-by:.*$", "", commit_msg, flags=re.DOTALL
                  ).strip()
                  if commit_msg:
                      notes = commit_msg
              except subprocess.CalledProcessError:
                  pass
          pathlib.Path("notes.md").write_text(notes, encoding="utf-8")
          PY
          # Create release if missing — first matrix job wins, others fall through.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [ -s notes.md ]; then
              gh release create "$tag" --title "$tag" --notes-file notes.md
            else
              # Last resort: let GitHub auto-generate notes from the commit
              # log between this tag and the previous release.
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          else
            # Backfill notes if the existing release still has the legacy
            # "Automated build." placeholder or is empty.
            current=$(gh release view "$tag" --json body --jq .body)
            if [ "$current" = "Automated build." ] || [ -z "$current" ]; then
              if [ -s notes.md ]; then
                gh release edit "$tag" --notes-file notes.md
              else
                gh release edit "$tag" --generate-notes
              fi
            fi
          fi
          shopt -s nullglob
          for f in ${{ matrix.artifact_glob }} ${{ matrix.artifact_glob }}.sha256; do
            echo "Uploading $f"
            gh release upload "$tag" "$f" --clobber
          done

      - name: Upload build artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn
